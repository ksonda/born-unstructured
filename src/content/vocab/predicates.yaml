# Every predicate used in a claim or a relation is declared here once.
# The label should read naturally between a subject and an object.

- id: requires
  label: requires
  description: The subject does not work unless the object is also present.

- id: kindOf
  label: is a kind of
  description: Everything the subject covers is also covered by the object. Concept to broader concept.

- id: isA
  label: is a
  description: The subject is one particular member of the category named by the object.

- id: fills
  label: currently fills
  description: The subject is one of the things doing the object's job at the moment. This changes. The role does not.

- id: namedAfter
  label: is named after
  description: The subject's name was taken from the object's, whatever else they do or do not have in common.

- id: namingAuthorityFor
  label: is the naming authority for
  description: The subject decides what belongs to the object and what its members are called.

- id: parentOf
  label: is a parent of
  description: The subject is a parent of the object.

- id: marriedTo
  label: is married to
  description: The subject and the object are married. Stated once; it holds in both directions.
