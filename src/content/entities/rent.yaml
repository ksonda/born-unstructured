description: >
  Jonathan Larson's musical, which opened off-Broadway 100 years to the day after La Bohème's
  premiere, with the story moved to New York's East Village. "Light My Candle" is the candle scene,
  nearly beat for beat. Mimi drops her stash instead of her key.
