label: Au clair de la lune
type: concept
description: >
  An 18th-century French folk song, composer and lyricist unknown. Now a lullaby. Less famous
  than Frère Jacques, with a much better backstory: by the last verse, the borrowed pen and the
  dead candle are no longer about writing or light.
language: fr
sameAs:
