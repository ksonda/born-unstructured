label: Les Champs-Élysées (version anglaise)
type: concept
description: >
  Joe Dassin's own English-language recording of Les Champs-Élysées, from 1969. Its words follow
  Waterloo Road, not Delanoë's French: the same plot and most of the same lines, with the street
  renamed and a café and an accordion standing in for the cellar and the guitar.
aliases:
  - the English version of Les Champs-Élysées
relations:
