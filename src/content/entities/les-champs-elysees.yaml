label: Les Champs-Élysées
type: concept
description: >
  Joe Dassin's 1969 hit, with French lyrics by Pierre Delanoë on the tune of Waterloo Road. The
  same scenes in the same order, moved to Paris, with a love story where the night out used to be.
  Sold about 600,000 copies in France.
